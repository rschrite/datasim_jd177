[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rschrite-datasim_jd177"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rschrite" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rschrite.github.io"
Repository = "https://github.com/rschrite/datasim_jd177"
Issues = "https://github.com/rschrite/datasim_jd177/issues"

[project.scripts]
datasim_jd177 = "datasim_jd177:main"

[tool.setuptools]
py-modules = ["datasim_jd177"]
